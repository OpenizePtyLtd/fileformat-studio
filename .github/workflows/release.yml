name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.10.0)"
        required: false
        default: ""
      draft:
        description: "Create release as Draft (recommended to review notes first)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Installer & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: get_version
        shell: pwsh
        run: |
          $rawTag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag_name }}" -ne "") {
              $rawTag = "${{ inputs.tag_name }}"
          }
          if (-not $rawTag -or $rawTag -notmatch '^v?\d+\.\d+') {
              $rawTag = "v0.10.0"
          }
          $cleanVersion = $rawTag.TrimStart('v')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "RAW_TAG=$rawTag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "APP_VERSION=$cleanVersion"
          Write-Host "Resolved release tag: $rawTag (Clean version: $cleanVersion)"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install NodeHost Dependencies
        working-directory: FileFormatAIStudio/FileFormatAIStudio/NodeHost
        run: |
          npm ci --omit=dev

      - name: Publish WinUI 3 Application (win-x64 self-contained)
        shell: pwsh
        run: |
          dotnet publish FileFormatAIStudio/FileFormatAIStudio/FileFormatAIStudio.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false

      - name: Bundle NodeHost Dependencies into Publish Output
        shell: pwsh
        run: |
          $sourceModules = "FileFormatAIStudio/FileFormatAIStudio/NodeHost/node_modules"
          $destModules = "FileFormatAIStudio/FileFormatAIStudio/bin/Release/net10.0-windows10.0.19041.0/win-x64/publish/NodeHost/node_modules"
          if (Test-Path $sourceModules) {
              New-Item -ItemType Directory -Path (Split-Path -Parent $destModules) -Force -ErrorAction SilentlyContinue
              Copy-Item -Path $sourceModules -Destination $destModules -Recurse -Force
              Write-Host "Successfully bundled node_modules into publish directory."
          }

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          $publishDir = "FileFormatAIStudio\FileFormatAIStudio\bin\Release\net10.0-windows10.0.19041.0\win-x64\publish"
          $zipName = "FileFormatAIStudio-Portable-win-x64.zip"
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipName -Force
          Write-Host "Created portable archive: $zipName"

      - name: Setup Inno Setup
        uses: joshlis/setup-inno@v1

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.APP_VERSION }}"
          iscc /DAppVersion=$ver installer.iss
          if (Test-Path "publish_installer\FileFormatAIStudio-Setup.exe") {
              Copy-Item "publish_installer\FileFormatAIStudio-Setup.exe" "publish_installer\FileFormatAIStudio-$ver-Setup.exe"
              Write-Host "Installer created successfully: publish_installer\FileFormatAIStudio-$ver-Setup.exe"
          } else {
              throw "Installer generation failed: output file not found."
          }

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.RAW_TAG }}
          name: "FileFormat AI Studio ${{ steps.get_version.outputs.RAW_TAG }}"
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: false
          generate_release_notes: true
          files: |
            publish_installer/FileFormatAIStudio-Setup.exe
            publish_installer/FileFormatAIStudio-*-Setup.exe
            FileFormatAIStudio-Portable-win-x64.zip

